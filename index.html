<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vida Pura Mercearia — Orgânicos & Naturais</title>
  <link rel="icon" href="https://tse2.mm.bing.net/th/id/OIP.9DE1TGCVrJEd5LY8Ea3cPAHaHa?rs=1&pid=ImgDetMain&o=7&rm=3" type="image/x-icon">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,500;1,600&family=DM+Sans:wght@400;500;600;700&family=Fraunces:wght@600;700;800&family=Manrope:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,600;1,700&display=swap"
    rel="stylesheet">
  <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
  <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
  <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box
    }

    html {
      scroll-behavior: smooth
    }

    :root {
      --vd: #1e3a2f;
      --vm: #2d5a3d;
      --vc: #4a7c59;
      --fo: #6b9e6e;
      --cr: #f5f0e8;
      --ar: #e8dfc8;
      --tc: #c4622d;
      --do: #c8a951;
      --tx: #1a1a18;
      --ts: #4a4a42;
    }

    body {
      font-family: 'DM Sans', sans-serif;
      background: var(--cr);
      color: var(--tx);
      overflow-x: hidden
    }

    #root {
      min-height: 100vh
    }

    p,
    h1,
    h2,
    h3,
    label,
    .hero-sub,
    .sobre-text,
    .prato-desc,
    .val-card p,
    .form-hint,
    .order-summary,
    .foot-quote {
      overflow-wrap: normal;
      word-break: normal;
      hyphens: none;
      text-wrap: normal
    }

    /* Scrollbar */
    ::-webkit-scrollbar {
      width: 6px
    }

    ::-webkit-scrollbar-track {
      background: var(--ar)
    }

    ::-webkit-scrollbar-thumb {
      background: var(--vc);
      border-radius: 3px
    }

    a,
    button,
    .cat-tab {
      cursor: pointer
    }

    /* Nav */
    .nav {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 1000;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px 48px;
      transition: all .4s;
      border-bottom: 1px solid transparent
    }

    .nav.scrolled {
      background: rgba(30, 58, 47, .97);
      backdrop-filter: blur(12px);
      border-bottom-color: rgba(255, 255, 255, .06)
    }

    .nav-logo {
      font-family: 'Playfair Display', serif;
      font-size: 1.1rem;
      color: var(--ar);
      letter-spacing: .12em;
      text-transform: uppercase
    }

    .nav-logo span {
      color: var(--do)
    }

    .nav-links {
      display: flex;
      gap: 32px;
      list-style: none
    }

    .nav-links a {
      color: rgba(245, 240, 232, .6);
      text-decoration: none;
      font-size: .78rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      transition: color .3s
    }

    .nav-links a:hover,
    .nav-links a.active {
      color: var(--do)
    }

    /* Hero */
    .hero {
      min-height: 100vh;
      background: var(--vd);
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden
    }

    .hero-canvas {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 1
    }

    .hero-glow {
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse 60% 50% at 80% 30%, rgba(74, 124, 89, .2) 0, transparent 60%), radial-gradient(ellipse 40% 60% at 10% 80%, rgba(107, 158, 110, .12) 0, transparent 50%);
      pointer-events: none;
      z-index: 1
    }

    .hero-body {
      position: relative;
      z-index: 5;
      flex: 1;
      display: flex;
      align-items: center;
      padding: 100px 48px 80px;
      gap: 60px
    }

    .hero-text {
      flex: 1;
      animation: fadeUp .9s ease both;
      padding-left: 64px
    }

    .eyebrow {
      font-family: 'Manrope', sans-serif;
      font-size: .82rem;
      font-weight: 700;
      letter-spacing: .26em;
      text-transform: uppercase;
      color: var(--fo);
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .eyebrow::before {
      content: '';
      display: block;
      width: 28px;
      height: 1px;
      background: var(--fo)
    }

    .hero-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(3.45rem, 7vw, 6.35rem);
      font-weight: 700;
      line-height: 1.02;
      color: var(--cr);
      margin-bottom: 18px
    }

    .hero-title em {
      font-style: italic;
      color: var(--do)
    }

    .hero-slogan {
      font-family: 'Cormorant Garamond', serif;
      font-size: 1.42rem;
      line-height: 1.35;
      color: var(--do);
      font-style: italic;
      font-weight: 600;
      margin-bottom: 24px;
      max-width: 520px
    }

    .hero-sub {
      font-family: 'Manrope', sans-serif;
      font-size: 1.08rem;
      line-height: 1.78;
      color: rgba(245, 240, 232, .68);
      max-width: 520px;
      margin-bottom: 40px;
      font-weight: 500
    }

    .btn-cta {
      display: inline-flex;
      align-items: center;
      gap: 10px;
      background: var(--tc);
      color: #fff;
      padding: 16px 36px;
      text-decoration: none;
      font-family: 'Manrope', sans-serif;
      font-size: .88rem;
      font-weight: 700;
      letter-spacing: .12em;
      text-transform: uppercase;
      border: none;
      transition: all .3s;
      position: relative;
      overflow: hidden
    }

    .btn-cta::before {
      content: '';
      position: absolute;
      top: 0;
      left: -100%;
      width: 100%;
      height: 100%;
      background: rgba(255, 255, 255, .1);
      transition: left .4s
    }

    .btn-cta:hover::before {
      left: 0
    }

    .btn-cta:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 30px rgba(196, 98, 45, .4)
    }

    .hero-img-wrap {
      flex: 1.15;
      position: relative;
      animation: fadeUp .9s .2s ease both;
      margin-left: -28px;
      max-width: 820px;
      width: 100%
    }

    .hero-img-frame {
      position: relative;
      overflow: hidden;
      border-radius: 24px
    }

    .hero-img-frame::before {
      content: '';
      position: absolute;
      inset: -1px;
      border: 1px solid rgba(200, 169, 81, .3);
      z-index: 2;
      pointer-events: none
    }

    .hero-img-frame img {
      width: 100%;
      height: clamp(480px, 48vw, 640px);
      object-fit: cover;
      object-position: left center;
      display: block;
      filter: brightness(.88) saturate(.9)
    }

    .hero-badge {
      position: absolute;
      bottom: -20px;
      left: -20px;
      background: var(--do);
      color: var(--vd);
      padding: 18px 22px;
      font-family: 'Playfair Display', serif;
      font-size: .78rem;
      font-style: italic;
      max-width: 170px;
      line-height: 1.5;
      z-index: 3
    }

    /* Stats */
    .stats {
      background: var(--vm);
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 2px
    }

    .stat-item {
      background: var(--vd);
      padding: 40px;
      text-align: center
    }

    .stat-num {
      font-family: 'Playfair Display', serif;
      font-size: 2.8rem;
      color: var(--do);
      line-height: 1;
      margin-bottom: 8px
    }

    .stat-label {
      font-size: .72rem;
      letter-spacing: .18em;
      text-transform: uppercase;
      color: rgba(245, 240, 232, .45)
    }

    /* Section helpers */
    .sec-label {
      font-size: .72rem;
      letter-spacing: .22em;
      text-transform: uppercase;
      color: var(--vc);
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 10px
    }

    .sec-label::before {
      content: '';
      width: 22px;
      height: 1px;
      background: currentColor
    }

    .sec-label.light {
      color: var(--fo)
    }

    .sec-label.light::before {
      background: var(--fo)
    }

    .sec-title {
      font-family: 'Playfair Display', serif;
      font-size: clamp(2rem, 3.5vw, 2.8rem);
      line-height: 1.15;
      color: var(--vd);
      margin-bottom: 20px
    }

    .sec-title em {
      font-style: italic;
      color: var(--tc)
    }

    .sec-title.light {
      color: var(--cr)
    }

    .sec-title.light em {
      color: var(--do)
    }

    /* Sobre */
    .sobre {
      padding: 110px 48px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 80px;
      align-items: center;
      background: var(--cr)
    }

    .sobre-imgs {
      position: relative
    }

    .sobre-img-main {
      width: 100%;
      height: 480px;
      object-fit: cover;
      display: block
    }

    .sobre-img-accent {
      position: absolute;
      bottom: -28px;
      right: -28px;
      width: 52%;
      height: 240px;
      object-fit: cover;
      border: 5px solid var(--cr);
      box-shadow: 0 16px 48px rgba(0, 0, 0, .12)
    }

    .sobre-text {
      font-size: .95rem;
      line-height: 1.85;
      color: var(--ts);
      font-weight: 300;
      margin-bottom: 14px
    }

    .sobre-addr {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      margin-top: 16px;
      font-size: .8rem;
      color: var(--vc)
    }

    /* Shop tabs */
    .shop-wrap {
      background: var(--ar);
      padding: 0
    }

    .shop-tabs {
      display: flex;
      border-bottom: 2px solid var(--areia, #e8dfc8)
    }

    .shop-tab {
      flex: 1;
      padding: 22px;
      background: none;
      border: none;
      font-family: 'Playfair Display', serif;
      font-size: 1.05rem;
      color: var(--ts);
      cursor: pointer;
      transition: all .3s;
      position: relative;
      letter-spacing: .04em
    }

    .shop-tab.active {
      color: var(--vd);
      background: var(--cr)
    }

    .shop-tab.active::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--do)
    }

    .shop-tab:hover {
      background: rgba(245, 240, 232, .5)
    }

    /* Loja */
    .loja {
      background: var(--cr);
      padding: 60px 48px
    }

    .toolbar {
      display: flex;
      gap: 14px;
      margin-bottom: 32px;
      flex-wrap: wrap;
      align-items: center
    }

    .search-wrap {
      flex: 1;
      min-width: 200px;
      position: relative
    }

    .search-wrap input {
      width: 100%;
      padding: 13px 18px 13px 42px;
      border: 1.5px solid var(--ar);
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      color: var(--tx);
      outline: none;
      transition: border-color .3s;
      border-radius: 12px
    }

    .search-wrap input:focus {
      border-color: var(--vc)
    }

    .search-wrap svg {
      position: absolute;
      left: 14px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--ts);
      pointer-events: none
    }

    .cat-tabs {
      display: flex;
      gap: 6px;
      flex-wrap: wrap
    }

    .cat-tab {
      padding: 9px 18px;
      border: 1.5px solid var(--ar);
      background: #fff;
      font-family: 'DM Sans', sans-serif;
      font-size: .75rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      color: var(--ts);
      cursor: pointer;
      transition: all .25s;
      border-radius: 20px
    }

    .cat-tab.active,
    .cat-tab:hover {
      background: var(--vd);
      border-color: var(--vd);
      color: #fff
    }

    .result-count {
      font-size: .8rem;
      color: var(--ts);
      margin-bottom: 20px
    }

    .result-count span {
      color: var(--vc);
      font-weight: 500
    }

    .produtos-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(195px, 1fr));
      gap: 18px;
      margin-bottom: 40px
    }

    .prod-card {
      background: #fff;
      border-radius: 16px;
      overflow: hidden;
      transition: all .35s cubic-bezier(.4, 0, .2, 1);
      position: relative;
      display: flex;
      flex-direction: column;
      height: 100%;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06);
      cursor: pointer
    }

    .prod-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 16px 40px rgba(0, 0, 0, .12)
    }

    .prod-card.esgotado {
      opacity: .64;
      filter: saturate(.62)
    }

    .prod-card.esgotado:hover {
      transform: none;
      box-shadow: 0 2px 12px rgba(0, 0, 0, .06)
    }

    .prod-img {
      width: 100%;
      height: 180px;
      object-fit: cover;
      object-position: center;
      display: block;
      padding: 0;
      background: linear-gradient(145deg, #f9f9f9 0%, #f0f0f0 100%);
      transition: transform .4s cubic-bezier(.4, 0, .2, 1)
    }

    .prod-card:hover .prod-img {
      transform: scale(1.05)
    }

    .prod-card.esgotado:hover .prod-img {
      transform: none
    }

    .prod-img-wrap {
      position: relative;
      overflow: hidden;
      border-radius: 16px 16px 0 0
    }

    .prod-badge {
      position: absolute;
      top: 10px;
      left: 10px;
      background: var(--vd);
      color: #fff;
      font-size: .62rem;
      letter-spacing: .1em;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 20px;
      z-index: 2
    }

    .prod-badge.esgotado-badge,
    .pd-stock-badge {
      background: var(--tc);
      color: #fff
    }

    .prod-fab {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 38px;
      height: 38px;
      border-radius: 50%;
      background: var(--vc);
      color: #fff;
      border: 2.5px solid #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      z-index: 3;
      box-shadow: 0 4px 14px rgba(74, 124, 89, .35);
      transition: all .3s cubic-bezier(.4, 0, .2, 1);
      font-size: 1.3rem;
      font-weight: 300;
      line-height: 1
    }

    .prod-fab:hover {
      background: var(--vd);
      transform: scale(1.12);
      box-shadow: 0 6px 20px rgba(74, 124, 89, .5)
    }

    .prod-fab.in-cart {
      background: var(--tc);
      box-shadow: 0 4px 14px rgba(196, 98, 45, .35)
    }

    .prod-fab.in-cart:hover {
      background: #a34d1f
    }

    .prod-fab:disabled,
    .pd-veja-fab:disabled {
      background: #9a9a92;
      box-shadow: none;
      cursor: not-allowed;
      transform: none
    }

    .prod-fab.in-cart:disabled,
    .pd-veja-fab.in-cart:disabled {
      background: var(--tc);
      color: #fff;
      opacity: 1
    }

    .prod-body {
      padding: 16px 16px 16px;
      display: flex;
      flex-direction: column;
      flex: 1
    }

    .prod-cat {
      font-size: .62rem;
      letter-spacing: .14em;
      text-transform: uppercase;
      color: var(--vc);
      margin-bottom: 6px;
      font-weight: 600
    }

    .prod-preco {
      font-family: 'DM Sans', sans-serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--vc);
      margin-bottom: 4px;
      display: flex;
      align-items: baseline;
      gap: 2px
    }

    .prod-preco .preco-cifrao {
      font-size: .8rem;
      font-weight: 600;
      color: var(--vc);
      margin-right: 2px
    }

    .prod-preco .preco-unit {
      font-size: .78rem;
      font-weight: 500;
      color: var(--ts)
    }

    .prod-nome {
      font-family: 'DM Sans', sans-serif;
      font-size: .78rem;
      color: var(--tx);
      line-height: 1.35;
      margin-bottom: 0;
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: .02em;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden
    }

    .prod-unit {
      font-size: .68rem;
      color: var(--ts);
      margin-bottom: 0;
      font-weight: 400
    }

    .prod-add {
      display: flex;
      flex-direction: column;
      align-items: stretch;
      gap: 0;
      margin-top: auto;
      padding-top: 10px
    }

    .prod-add .qty-ctrl {
      width: 100%;
      justify-content: space-between;
      border-radius: 10px;
      overflow: hidden
    }

    .qty-ctrl {
      display: flex;
      align-items: center;
      border: 1.5px solid rgba(74, 124, 89, .15);
      background: rgba(74, 124, 89, .04);
      border-radius: 10px
    }

    .qty-btn {
      width: 30px;
      height: 30px;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 1rem;
      color: var(--vc);
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all .2s;
      font-weight: 600;
      border-radius: 8px
    }

    .qty-btn:hover {
      background: rgba(74, 124, 89, .15);
      color: var(--vd)
    }

    .qty-val {
      width: 30px;
      text-align: center;
      font-size: .82rem;
      font-weight: 600;
      color: var(--vd)
    }

    .qty-val.weight-val {
      width: auto;
      min-width: 54px;
      padding: 0 6px
    }

    .qty-gram-wrap {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 2px;
      min-width: 64px;
      padding: 0 6px;
      font-size: .82rem;
      font-weight: 500;
      color: var(--tx)
    }

    .qty-gram-input {
      width: 44px;
      border: 0;
      background: transparent;
      color: inherit;
      font: inherit;
      text-align: right;
      outline: none;
      padding: 0
    }

    .qty-gram-unit {
      color: var(--vd);
      font-weight: 600
    }

    .add-btn {
      flex: 1;
      background: var(--vc);
      color: #fff;
      border: none;
      padding: 9px 12px;
      font-family: 'DM Sans', sans-serif;
      font-size: .72rem;
      letter-spacing: .08em;
      text-transform: uppercase;
      cursor: pointer;
      transition: all .3s;
      border-radius: 10px;
      font-weight: 600
    }

    .add-btn:hover {
      background: var(--vd);
      transform: translateY(-1px);
      box-shadow: 0 4px 14px rgba(30, 58, 47, .25)
    }

    .add-btn.added {
      background: var(--tc)
    }

    .add-btn:disabled,
    .qty-btn:disabled,
    .pd-qty-btn:disabled,
    .pd-add-btn:disabled {
      opacity: .55;
      cursor: not-allowed;
      transform: none;
      box-shadow: none
    }

    .stock-note {
      font-size: .68rem;
      color: var(--tc);
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      margin-top: 8px
    }

    /* Product Detail Modal */
    .prod-detail-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      z-index: 7000;
      opacity: 0;
      pointer-events: none;
      transition: opacity .35s
    }

    .prod-detail-overlay.open {
      opacity: 1;
      pointer-events: all
    }

    .prod-detail {
      position: fixed;
      top: 0;
      right: 0;
      width: 480px;
      max-width: 100vw;
      height: 100vh;
      background: #fff;
      z-index: 7001;
      display: flex;
      flex-direction: column;
      transform: translateX(100%);
      transition: transform .4s cubic-bezier(.4, 0, .2, 1);
      box-shadow: -8px 0 48px rgba(0, 0, 0, .15);
      overflow-y: auto
    }

    .prod-detail.open {
      transform: translateX(0)
    }

    .pd-header {
      display: flex;
      align-items: center;
      padding: 18px 20px;
      border-bottom: 1px solid rgba(0, 0, 0, .06);
      position: sticky;
      top: 0;
      background: #fff;
      z-index: 2
    }

    .pd-back {
      background: none;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      font-family: 'DM Sans', sans-serif;
      font-size: .88rem;
      color: var(--ts);
      transition: color .2s;
      padding: 0
    }

    .pd-back:hover {
      color: var(--vd)
    }

    .pd-back svg {
      width: 20px;
      height: 20px
    }

    .pd-header-title {
      flex: 1;
      text-align: center;
      font-family: 'DM Sans', sans-serif;
      font-size: 1rem;
      font-weight: 600;
      color: var(--tx)
    }

    .pd-img-wrap {
      width: 100%;
      background: linear-gradient(145deg, #f9f9f9, #f0f0f0);
      display: flex;
      flex-direction: column;

    function categoriaEspecialProduto(texto) {
      const encontrada = CATEGORIAS_ESPECIAIS.find(([, palavras]) => contemAlgumaPalavra(texto, palavras));

      if (texto.startsWith('tomate ')) return 'hortifruti';
      if (texto.startsWith('uva ')) return 'hortifruti';
      if (texto.startsWith('cha ') || texto.startsWith('chá ')) return 'bebidas';
      if (texto.startsWith('cafe ') || texto.startsWith('café ')) return 'bebidas';
      if (texto.startsWith('maca ') && !texto.includes(' bite') && !texto.includes('peruana')) return 'hortifruti';
      return '';
    }

    const fmtBRL = v => 'R$ ' + v.toFixed(2).replace('.', ',');
    const catLabel = id => CATS.find(c => c.id === id)?.label || 'Mercearia';
    const onlyDigits = v => (v || '').replace(/\D/g, '');
    const normalizeText = v => (v || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();
    const formatCEP = v => {
      const d = onlyDigits(v).slice(0, 8);
      return d.length > 5 ? d.slice(0, 5) + '-' + d.slice(5) : d;
    };
    const formatPhone = v => {
      const d = onlyDigits(v).slice(0, 11);
      if (d.length <= 2) return d;
      if (d.length <= 6) return `(${d.slice(0, 2)}) ${d.slice(2)}`;
      if (d.length <= 10) return `(${d.slice(0, 2)}) ${d.slice(2, 6)}-${d.slice(6)}`;
      return `(${d.slice(0, 2)}) ${d.slice(2, 7)}-${d.slice(7)}`;
    };
    const parseTimeToMin = s => {
      const m = /^(\d{1,2}):(\d{2})$/.exec(String(s || '').trim());
      if (!m) return null;
      const hh = Number(m[1]), mm = Number(m[2]);
      if (Number.isNaN(hh) || Number.isNaN(mm) || hh > 23 || mm > 59) return null;
      return hh * 60 + mm;
    };
    const LOJA_JANELA_MIN = 8 * 60 + 30;
    const LOJA_JANELA_MAX = 18 * 60 + 30;
    const isJoinville = cidade => normalizeText(cidade) === 'joinville';
    const findCidadeEntrega = cidade => CIDADES_ENTREGA.find(c => normalizeText(c.cidade) === normalizeText(cidade));
    const isAlmocoItem = item => String(item.id).startsWith('p');
    const isWeightedHortifruti = item => item?.cat === 'hortifruti' && normalizeText(item?.unidade) === 'kg';
    const isAboboraKgHorti = item => isWeightedHortifruti(item) && normalizeText(item?.nome || '').includes('abobora');
    const getQtyStep = item => isWeightedHortifruti(item) ? 0.1 : 1;
    const getMinQty = item => {
      if (isWeightedHortifruti(item)) return isAboboraKgHorti(item) ? 0.5 : 0.1;
      return 1;
    };
    const normalizeQty = (item, qty) => {
      const raw = Number(qty) || 0;
      if (isWeightedHortifruti(item)) {
        const rounded = Math.round(raw * 1000) / 1000;
        return Math.max(getMinQty(item), rounded);
      }
      return Math.max(1, Math.round(raw));
    };
    const gramsToQty = (item, grams) => normalizeQty(item, Number(grams) / 1000);
    const qtyToGrams = (item, qty) => Math.round(normalizeQty(item, qty) * 1000);
    const formatQty = (item, qty) => {
      if (!isWeightedHortifruti(item)) return String(Math.round(qty));
      const safe = normalizeQty(item, qty);
      if (safe < 1) return `${Math.round(safe * 1000)}g`;
      const kg = Number.isInteger(safe) ? String(safe) : String(safe).replace('.', ',');
      return `${kg}kg`;
    };
    const formatUnitPrice = item => fmtBRL(item.preco) + (isWeightedHortifruti(item) ? '/kg' : '');
    const findFrete = (bairro, cidade) => {
      const bairroNorm = normalizeText(bairro);
      const cidadeNorm = normalizeText(cidade);
      const cidadeDireta = findCidadeEntrega(cidade);
      if (cidadeDireta && cidadeDireta.valor !== null) {
        return { bairro: cidadeDireta.cidade, valor: cidadeDireta.valor };
      }
      const cidadeMatch = FRETES.find(f => normalizeText(f.bairro) === cidadeNorm);
      if (cidadeNorm && !isJoinville(cidadeNorm) && cidadeMatch) return cidadeMatch;
      const terms = [bairroNorm, cidadeNorm].filter(Boolean);
      for (const term of terms) {
        const exact = FRETES.find(f => normalizeText(f.bairro) === term);
        if (exact) return exact;
      }
      for (const term of terms) {
        const partial = FRETES.find(f => {
          const b = normalizeText(f.bairro);
          return b.length > 4 && (b.includes(term) || term.includes(b));
        });
        if (partial) return partial;
      }
      return null;
    };
    const copyText = async text => {
      try {
        if (navigator.clipboard) {
          await navigator.clipboard.writeText(text);
        } else {
          throw new Error('clipboard indisponivel');
        }
      } catch {
        const ta = document.createElement('textarea');
        ta.value = text;
        ta.setAttribute('readonly', '');
        ta.style.position = 'fixed';
        ta.style.opacity = '0';
        document.body.appendChild(ta);
        ta.select();
        document.execCommand('copy');
        document.body.removeChild(ta);
      }
    };

    /* ─── HOOKS ─── */
    function useCounter(target, started) {
      const [val, setVal] = useState(0);
      useEffect(() => {
        if (!started) return;
        let cur = 0;
        const step = Math.ceil(target / 60);
        const t = setInterval(() => {
          cur = Math.min(cur + step, target);
          setVal(cur);
          if (cur >= target) clearInterval(t);
        }, 25);
        return () => clearInterval(t);
      }, [started, target]);
      return val;
    }

    /* ─── COMPONENTS ─── */
    function HeroParticles() {
      const canvasRef = useRef(null);
      useEffect(() => {
        const canvas = canvasRef.current;
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const resize = () => { canvas.width = canvas.offsetWidth; canvas.height = canvas.offsetHeight; };
        resize();
        window.addEventListener('resize', resize);
        const N = 20;
        const leaves = Array.from({ length: N }, () => ({
          x: Math.random() * canvas.width, y: Math.random() * canvas.height,
          r: 2 + Math.random() * 3, sx: -.3 + Math.random() * .6,
          sy: .2 + Math.random() * .45, op: .06 + Math.random() * .14,
          w: Math.random() * Math.PI * 2, ws: .008 + Math.random() * .01,
        }));
        let raf;
        const draw = () => {
          ctx.clearRect(0, 0, canvas.width, canvas.height);
          leaves.forEach(l => {
            l.x += l.sx + Math.sin(l.w) * .25; l.y += l.sy; l.w += l.ws;
            if (l.y > canvas.height + 10) { l.y = -10; l.x = Math.random() * canvas.width; }
            if (l.x < -10) l.x = canvas.width + 10; if (l.x > canvas.width + 10) l.x = -10;
            ctx.save(); ctx.translate(l.x, l.y); ctx.rotate(l.w);
            ctx.beginPath(); ctx.ellipse(0, 0, l.r * 2.2, l.r, 0, 0, Math.PI * 2);
            ctx.fillStyle = `rgba(107,158,110,${l.op})`; ctx.fill(); ctx.restore();
          });
          raf = requestAnimationFrame(draw);
        };
        draw();
        return () => { window.removeEventListener('resize', resize); cancelAnimationFrame(raf); };
      }, []);
      return <canvas ref={canvasRef} className="hero-canvas" style={{ position: 'absolute', inset: 0, width: '100%', height: '100%' }} />;
    }

    function StatBar() {
      const ref = useRef(null);
      const [started, setStarted] = useState(false);
      useEffect(() => {
        const obs = new IntersectionObserver(([e]) => { if (e.isIntersecting) { setStarted(true); obs.disconnect(); } }, { threshold: .5 });
        if (ref.current) obs.observe(ref.current);
        return () => obs.disconnect();
      }, []);
      const v1 = useCounter(CONTADORES.certificados, started);
      const v2 = useCounter(CONTADORES.agricultores, started);
      const v3 = useCounter(CONTADORES.produtos, started);
      return (
        <div className="stats" ref={ref}>
          <div className="stat-item"><div className="stat-num">{v1}%</div><div className="stat-label">Orgânicos Certificados</div></div>

        </div>
      );

    function ProductCard({ p, cartQty, onAdd, onUpdateCart, onOpen }) {
      const weighted = isWeightedHortifruti(p);
      const step = getQtyStep(p);
      const minQty = getMinQty(p);
      const [qty, setQty] = useState(() => minQty);
      const [gramsInput, setGramsInput] = useState(() => String(qtyToGrams(p, minQty)));
      const inCart = cartQty > 0;
      const displayedQty = inCart ? cartQty : qty;
      const selectedQty = weighted && gramsInput ? gramsToQty(p, gramsInput) : qty;
      useEffect(() => {
        if (weighted && inCart) setGramsInput(String(qtyToGrams(p, cartQty)));
      }, [weighted, inCart, cartQty, p.id]);
      const changeQty = delta => {
        if (inCart) {
          onUpdateCart && onUpdateCart(p.id, delta);
          return;
        }
        setQty(q => {
          const next = weighted && delta < 0 && q <= minQty ? minQty : normalizeQty(p, q + delta);
          if (weighted) setGramsInput(String(qtyToGrams(p, next)));
          return next;
        });
      };
      const changeGrams = value => {
        const grams = value.replace(/\D/g, '');
        setGramsInput(grams);
        if (inCart) return;
        if (grams) setQty(gramsToQty(p, grams));
      };
      const fixGramsInput = () => {
        const safe = gramsInput ? gramsToQty(p, gramsInput) : minQty;
        if (inCart) {
          onUpdateCart && onUpdateCart(p.id, safe - cartQty);
          setGramsInput(String(qtyToGrams(p, safe)));
          return;
        }
        setQty(safe);
        setGramsInput(String(qtyToGrams(p, safe)));
      };
      const toastMsg = weighted
        ? `✓ ${formatQty(p, selectedQty)} de ${p.nome} adicionado!`
        : '✓ ' + p.nome + ' adicionado!';
      const hasRichInfo = !!(p.ingredientes || p.info || p.img2 || p.contemGluten === true || p.contemGluten === false);
      const esgotado = itemEstaEsgotado(p);
      return (
        <div className={`prod-card${esgotado ? ' esgotado' : ''}`} onClick={() => onOpen(p)}>
          <div className="prod-img-wrap">
            <img className="prod-img" src={p.img} alt={p.nome} loading="lazy" onError={e => { e.currentTarget.onerror = null; e.currentTarget.src = FALLBACK_PRODUCT_IMAGE; }} />
            {esgotado ? <span className="prod-badge esgotado-badge">Esgotado</span> : (p.badge && <span className="prod-badge">{p.badge}</span>)}
            <button
              className={`prod-fab${inCart ? ' in-cart' : ''}`}
              onClick={e => { e.stopPropagation(); if (esgotado) return showToast('Produto esgotado no momento'); if (inCart) return; onAdd(p, selectedQty); showToast(toastMsg); }}
              title={esgotado ? 'Produto esgotado' : (inCart ? 'Produto já está no carrinho' : 'Adicionar ao carrinho')}
              disabled={esgotado || inCart}
            >
              {esgotado ? '×' : (inCart ? '✓' : '+')}
            </button>
          </div>
          <div className="prod-body">
            <div className="prod-preco">
              <span className="preco-cifrao">R$</span> {fmtBRL(p.preco).replace('R$ ', '')}<span className="preco-unit">/{p.unidade.toLowerCase()}</span>
            </div>
            <div className="prod-nome">{p.nome}</div>
            <div className="prod-unit">{catLabel(p.cat)} · {p.unidade}</div>
            {isAboboraKgHorti(p) && (
              <div style={{ fontSize: '.65rem', color: 'var(--tc)', marginTop: 4, lineHeight: 1.35 }}>Pedido mínimo 500&nbsp;g (abóbora não fraciona abaixo disso).</div>
